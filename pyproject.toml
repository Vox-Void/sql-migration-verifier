[project]
name = "sql-migration-verifier"
version = "0.1.0"
description = "Verify synthetic payments reports before migrating PostgreSQL queries to Spark SQL"
requires-python = ">=3.11,<3.12"
dependencies = ["psycopg[binary]==3.3.3", "sqlglot==30.33.0"]

[dependency-groups]
worker = ["pyspark==4.0.1"]
dev = ["mypy==1.19.1", "pytest==9.0.2", "ruff==0.14.14"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs the pinned PostgreSQL and Spark containers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/migration_verifier"]
