services:
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_DB: migration
      POSTGRES_USER: fixture_owner
      POSTGRES_PASSWORD: local-fixture-only
      TZ: UTC
    ports:
      - "127.0.0.1::5432"
    volumes:
      - source-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture_owner -d migration"]
      interval: 2s
      timeout: 2s
      retries: 25
  worker:
    build: .
    image: sql-migration-verifier-worker:local
    init: true
    hostname: localhost
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512
    stdin_open: true
volumes:
  source-database:
