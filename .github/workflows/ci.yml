name: Migration verifier checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        run: pipx install uv==0.13.9
      - name: Build and verify both runtimes
        run: ./scripts/dev bootstrap
      - name: Check the verifier and both engines
        run: ./scripts/dev test
      - name: Produce the demo and benchmark
        run: |
          ./scripts/dev demo
          ./scripts/dev eval
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-evidence
          path: artifacts/
